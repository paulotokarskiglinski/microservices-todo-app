x-mongo: &mongo
  # Pinned: the floating "9.0" tag currently ships a broken amd64 image
  image: mongo:9.0.2-noble
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
    interval: 10s
    timeout: 10s
    retries: 6
    start_period: 20s

services:
  mongodb-1:
    <<: *mongo
    container_name: mongodb-1
  mongodb-2:
    <<: *mongo
    container_name: mongodb-2
  mongodb-3:
    <<: *mongo
    container_name: mongodb-3
  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbit-1
    container_name: rabbit-1
    environment:
      # Must match the amqp:// connection strings in each service's appsettings.json
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    ports:
      - 5672:5672
      - 15672:15672
  angular-todo-app:
    build: ./angular-todo-app
    container_name: angular-todo-app
    ports:
      - 8080:80
  dotnet-todo-signalr:
    build: ./dotnet-todo-signalr
    hostname: dotnet-todo-signalr
    container_name: dotnet-todo-signalr
    restart: on-failure
    ports:
      - 7267:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
  dotnet-todo-api:
    build: ./dotnet-todo-api
    hostname: dotnet-todo-api
    container_name: dotnet-todo-api
    restart: on-failure
    ports:
      - 7264:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb-1:
        condition: service_healthy
  dotnet-tipotarefa-api:
    build: ./dotnet-tipotarefa-api
    hostname: dotnet-tipotarefa-api
    container_name: dotnet-tipotarefa-api
    restart: on-failure
    ports:
      - 7265:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb-2:
        condition: service_healthy
  dotnet-usuario-api:
    build: ./dotnet-usuario-api
    hostname: dotnet-usuario-api
    container_name: dotnet-usuario-api
    restart: on-failure
    ports:
      - 7266:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb-3:
        condition: service_healthy
  dotnet-gateway-ocelot:
    build: ./dotnet-gateway-ocelot
    hostname: dotnet-gateway-ocelot
    container_name: dotnet-gateway-ocelot
    restart: on-failure
    ports:
      - 7081:8080
    depends_on:
      - dotnet-todo-api
      - dotnet-usuario-api
      - dotnet-tipotarefa-api
